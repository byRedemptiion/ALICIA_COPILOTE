[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alicia-copilot"
version = "0.5.0"
description = "Copilote visuel pour jeux vidéo sous Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "Pillow>=11,<13",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "vosk>=0.3.45,<0.4",
  "sounddevice>=0.5,<0.6",
  "kokoro-onnx>=0.6.1,<0.7",
  "faster-whisper>=1.2,<2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "huggingface-hub>=0.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
alicia = "alicia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alicia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
